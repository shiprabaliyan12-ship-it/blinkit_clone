<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Store</title>
</head>

<body>

    <!-- Header -->
    <header>

        <h1>blinkit</h1>

        <h3>Delivery in 17 minutes</h3>
        <p>Muzaffarnagar, Uttar Pradesh</p>

        <input type="text" placeholder="Search for products...">

        <button>Login</button>
        <button>🛒 Cart</button>

    </header>

    <hr>

    <!-- Main Banner -->
    <section>

        <h1>Stock up on daily essentials</h1>

        <p>
            Get farm-fresh goodness & a range of exotic

        </p>

        <button>Shop Now</button>

        <br><br>

        <img
            src="https://images.unsplash.com/photo-1542838132-92c53300491e"
            alt="Fresh fruits and vegetables"
            width="500"
        >

    </section>

    <hr>

    <!-- Service Cards 
    <section>

        <h2>Our Services</h2>

        <div>

            <h3>Pharmacy at your doorstep!</h3>

            <p>Medicines & healthcare products</p>

            <button>Order Now</button>

            <br>

            <img
                src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae"
                alt="Pharmacy"
                width="150"
            >

        </div>

        <br>

        <div>

            <h3>Pet care supplies at your door</h3>

            <p>Food, toys & more</p>

            <button>Order Now</button>

            <br>

            <img
                src="https://images.unsplash.com/photo-1601758228041-f3b2795255f1"
                alt="Pet care"
                width="150"
            >

        </div>

        <br>

        <div>

            <h3>No time for a diaper run?</h3>

            <p>Baby care products</p>

            <button>Order Now</button>

            <br>

            <img
                src="https://images.unsplash.com/photo-1519689680058-324335c77eba"
                alt="Baby care"
                width="150"
            >

        </div>

    </section>

    <hr>

    <!-- Categories 
    <section>

        <h2>Categories</h2>

        <div>

            <img src="https://cdn-icons-png.flaticon.com/512/3081/3081967.png"
                 width="70"
                 alt="Fruits">

            <p>Fruits & Vegetables</p>

        </div>

        <div>

            <img src="https://cdn-icons-png.flaticon.com/512/3050/3050158.png"
                 width="70"
                 alt="Dairy">

            <p>Dairy, Bread & Eggs</p>

        </div>

        <div>

            <img src="https://cdn-icons-png.flaticon.com/512/2405/2405479.png"
                 width="70"

            <p>Cold Drinks & Juices</p>

        </div>

        <div>

            <img src="https://cdn-icons-png.flaticon.com/512/2553/2553691.png"

            <p>Snacks & Munchies</p>

        </div>

        <div>

            <img src="https://cdn-icons-png.flaticon.com/512/3082/3082031.png"

        </div>

        <div>

            <img src="https://cdn-icons-png.flaticon.com/512/3050/3050255.png"
